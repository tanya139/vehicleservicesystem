<nav style="background: #898AC4; padding: 0 24px; display: flex; align-items: center; height: 60px; box-shadow: 0 2px 8px rgba(137,138,196,0.4);">

  <span style="color: #FFF2E0; font-weight: 700; font-size: 18px; letter-spacing: 0.5px; margin-right: auto;">
    🔧 VehicleServ
  </span>

  <ng-container *ngIf="auth.isLoggedIn()">

    <span style="color: #FFF2E0; font-size: 14px; margin-right: 20px; font-weight: 500;">
      Welcome, {{ auth.getUsername() }}!
    </span>

    <ng-container *ngIf="auth.getRole() === 'OWNER'">
      <a routerLink="/vehicle"
        style="color: #FFF2E0; text-decoration: none; margin-right: 16px; font-size: 14px; padding: 6px 12px; border-radius: 6px; transition: background 0.2s;"
        onmouseover="this.style.background='rgba(255,242,224,0.2)'"
        onmouseout="this.style.background='transparent'">My Vehicles</a>
      <a routerLink="/service-request"
        style="color: #FFF2E0; text-decoration: none; margin-right: 16px; font-size: 14px; padding: 6px 12px; border-radius: 6px;"
        onmouseover="this.style.background='rgba(255,242,224,0.2)'"
        onmouseout="this.style.background='transparent'">Request Service</a>
      <a routerLink="/services"
        style="color: #FFF2E0; text-decoration: none; margin-right: 16px; font-size: 14px; padding: 6px 12px; border-radius: 6px;"
        onmouseover="this.style.background='rgba(255,242,224,0.2)'"
        onmouseout="this.style.background='transparent'">Service History</a>
    </ng-container>

    <ng-container *ngIf="auth.getRole() === 'ADMIN'">
      <a routerLink="/admin"
        style="color: #FFF2E0; text-decoration: none; margin-right: 16px; font-size: 14px; padding: 6px 12px; border-radius: 6px;"
        onmouseover="this.style.background='rgba(255,242,224,0.2)'"
        onmouseout="this.style.background='transparent'">Admin Dashboard</a>
    </ng-container>

    <ng-container *ngIf="auth.getRole() === 'MECHANIC'">
      <a routerLink="/mechanic"
        style="color: #FFF2E0; text-decoration: none; margin-right: 16px; font-size: 14px; padding: 6px 12px; border-radius: 6px;"
        onmouseover="this.style.background='rgba(255,242,224,0.2)'"
        onmouseout="this.style.background='transparent'">My Services</a>
    </ng-container>

    <button
      (click)="logout()"
      style="padding: 8px 18px; background: #FFF2E0; color: #898AC4;
             border: none; border-radius: 6px; font-weight: 700;
             font-size: 14px; cursor: pointer; touch-action: manipulation;"
      onmouseover="this.style.background='#C0C9EE'; this.style.color='#333'"
      onmouseout="this.style.background='#FFF2E0'; this.style.color='#898AC4'"
      onmousedown="this.style.transform='scale(0.97)'"
      onmouseup="this.style.transform='scale(1)'">
      Logout
    </button>

  </ng-container>

</nav>

<router-outlet></router-outlet>
