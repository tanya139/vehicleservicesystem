<div style="min-height: 100vh; background: #FCB7C7; display: flex; align-items: center; justify-content: center;">
  <div style="background: white; max-width: 420px; width: 100%; padding: 40px; border-radius: 16px; box-shadow: 0 8px 30px rgba(202,97,128,0.15);">

    <div style="text-align: center; margin-bottom: 32px;">
      <div style="width: 56px; height: 56px; background: #9ED3DC; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 24px;">👤</span>
      </div>
      <h2 style="margin: 0; color: #CA6180; font-size: 24px; font-weight: 700;">Create Account</h2>
      <p style="margin: 6px 0 0; color: #888; font-size: 14px;">Join VehicleServ today</p>
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px;">Username</label>
      <input [(ngModel)]="user.username" placeholder="Choose a username"
        style="width: 100%; padding: 13px 14px; border: 1.5px solid #FCB7C7; border-radius: 8px; font-size: 15px; box-sizing: border-box; outline: none;"
        onfocus="this.style.borderColor='#CA6180'" onblur="this.style.borderColor='#FCB7C7'">
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px;">Email</label>
      <input [(ngModel)]="user.email" placeholder="Your email address" type="email"
        style="width: 100%; padding: 13px 14px; border: 1.5px solid #FCB7C7; border-radius: 8px; font-size: 15px; box-sizing: border-box; outline: none;"
        onfocus="this.style.borderColor='#CA6180'" onblur="this.style.borderColor='#FCB7C7'">
    </div>

    <div style="margin-bottom: 16px;">
      <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px;">Password</label>
      <input [(ngModel)]="user.password" placeholder="Create a password" type="password"
        style="width: 100%; padding: 13px 14px; border: 1.5px solid #FCB7C7; border-radius: 8px; font-size: 15px; box-sizing: border-box; outline: none;"
        onfocus="this.style.borderColor='#CA6180'" onblur="this.style.borderColor='#FCB7C7'">
    </div>

    <div style="margin-bottom: 24px;">
      <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px;">Role</label>
      <select [(ngModel)]="user.role"
        style="width: 100%; padding: 13px 14px; border: 1.5px solid #FCB7C7; border-radius: 8px; font-size: 15px; box-sizing: border-box; background: white; cursor: pointer; outline: none;"
        onfocus="this.style.borderColor='#CA6180'" onblur="this.style.borderColor='#FCB7C7'">
        <option value="OWNER">Vehicle Owner</option>
        <option value="MECHANIC">Mechanic</option>
        <option value="ADMIN">Admin</option>
      </select>
    </div>

    <button
      (click)="register()"
      style="width: 100%; padding: 14px; background: #CA6180;
             color: white; border: none; border-radius: 8px;
             font-size: 16px; font-weight: 700; cursor: pointer;
             touch-action: manipulation; letter-spacing: 0.5px;"
      onmouseover="this.style.background='#b5506e'"
      onmouseout="this.style.background='#CA6180'"
      onmousedown="this.style.transform='scale(0.98)'"
      onmouseup="this.style.transform='scale(1)'">
      Create Account
    </button>

    <p style="text-align: center; margin-top: 12px; font-size: 14px; color: #555;">{{ message }}</p>
    <p style="text-align: center; margin-top: 8px; font-size: 14px; color: #888;">
      Already have an account? <a routerLink="/login" style="color: #CA6180; font-weight: 600; text-decoration: none;">Sign in</a>
    </p>
  </div>
</div>
